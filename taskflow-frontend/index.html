<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TaskFlow Test Client</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">TaskFlow</div>

  <nav>
    <a href="index.html" class="active">Tasks</a>
    <a href="calendar.html">Calendar</a>
  </nav>
</header>

<h1>TaskFlow Test Client</h1>

<div id="baseUrlRow">
  <label>Backend URL</label>
  <input type="text" id="baseUrl" value="http://localhost:8080/api/tasks">
</div>

<form id="taskForm">
  <label>Title</label>
  <input type="text" id="title" required>

  <label>Due Date</label>
  <input type="date" id="dueDate">

  <label>Estimated Minutes</label>
  <input type="number" id="estimatedMinutes" min="1" value="30">

  <label>Label</label>
  <input type="text" id="label" placeholder="Work, Personal, Urgent...">

  <button type="submit">Create Task</button>
</form>

<div id="status"></div>

<div id="taskList">
  <strong>Tasks</strong>
  <button id="refreshBtn">Refresh</button>
  <div id="tasks"></div>
</div>

<script src="script.js"></script>
</body>
</html>
